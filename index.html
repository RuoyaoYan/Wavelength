<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Game Portal</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: neo-minimal. A quiet off-white page, a small left-aligned title, and one column of flat, low-saturation
   tiles with soft shadows: label on the left, arrow on the right. */
*,*::before,*::after{box-sizing:border-box}
:root{
  --bg:#f2f0eb; --card:#fbfaf7; --ink:#2a2a2c; --muted:#77736c; --line:rgba(42,42,44,.08); --link:#5d6b7a;
  --slate:#c9d0d6; --clay:#dcc6bf; --sand:#e2d7c3; --sage:#c8d1c1;
  --font:'Manrope',-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans','Noto Sans',Roboto,sans-serif;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
html,body{background:var(--bg);color:var(--ink);min-height:100%}
body{margin:0;font-family:var(--font);font-size:17px;line-height:1.45;padding-block:56px 48px}
.top,.list,.foot{width:min(360px,100%);margin-inline:auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
h1{margin:0;font-size:2.1rem;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.top p{margin:8px 0 0;color:var(--muted);font-size:.95rem}
.list{display:flex;flex-direction:column;gap:14px;margin-top:36px}
.pill{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:68px;padding:0 22px;border-radius:18px;
  background:var(--c);border:1px solid var(--line);color:var(--ink);text-decoration:none;font-size:1.15rem;font-weight:600;letter-spacing:-.01em;
  box-shadow:0 1px 2px rgba(42,42,44,.05),0 10px 24px -14px rgba(42,42,44,.35);transition:transform .15s ease,box-shadow .15s ease}
.pill::after{content:"→";font-weight:500;opacity:.55;transition:transform .15s ease,opacity .15s ease}
.pill:hover{transform:translateY(-2px);box-shadow:0 2px 4px rgba(42,42,44,.06),0 16px 30px -14px rgba(42,42,44,.4)}
.pill:hover::after{transform:translateX(3px);opacity:.9}
.pill:active{transform:translateY(0);box-shadow:0 1px 2px rgba(42,42,44,.08)}
.pill:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.slate{--c:var(--slate)} .clay{--c:var(--clay)} .sand{--c:var(--sand)} .sage{--c:var(--sage)}
.foot{margin-top:28px;color:var(--muted);font-size:.85rem}
#game{position:fixed;inset:0;width:100%;height:100%;border:0;z-index:50;background:#050b16}
#game[data-g="imposter"]{background:#ecedf2}
body.playing{overflow:hidden}
/* Achievements: its own screen. One plain card per game, newest unlock first, with the unlock rules folded away below. */
.ach{position:fixed;inset:0;z-index:40;overflow-y:auto;background:var(--bg);padding-block:32px 48px;display:none}
body.ach-open .ach{display:block}
body.ach-open{overflow:hidden}
.ach-in{width:min(560px,100%);margin:0 auto;padding-inline:max(20px,env(safe-area-inset-left,0px)) max(20px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
.ach h2{margin:4px 0 8px;font-size:2rem;font-weight:700;letter-spacing:-.02em}
.ach .back{align-self:flex-start;color:var(--muted);text-decoration:none;font-weight:600;font-size:.95rem}
.ach .back:hover{color:var(--ink)}
.ach .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px 20px;box-shadow:0 1px 2px rgba(42,42,44,.04),0 10px 24px -16px rgba(42,42,44,.3)}
.ach h3{margin:0 0 12px;font-size:1.05rem;font-weight:700;display:flex;align-items:center;gap:10px}
.ach h3::before{content:"";width:12px;height:12px;border-radius:4px;background:var(--c);box-shadow:inset 0 0 0 1px var(--line)}
.ach ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:12px}
.ach li{line-height:1.45;overflow-wrap:anywhere}
.ach li time{font-weight:700;margin-right:6px}
.ach li .who{display:block;color:var(--muted);font-size:.9rem}
.ach li .pend{color:var(--muted);font-size:.8rem;font-style:italic}
.ach .none{color:var(--muted);margin:0}
.ach details{margin-top:16px;border-top:1px solid var(--line);padding-top:12px}
.ach summary{cursor:pointer;color:var(--link);font-weight:600;font-size:.92rem}
.ach dl{margin:10px 0 0;display:grid;gap:8px;font-size:.92rem}
.ach dt{font-weight:700}
.ach dd{margin:0;color:var(--muted)}
@media (prefers-reduced-motion:reduce){.pill,.pill::after{transition:none}}
</style>
</head><body>
<header class="top"><h1>Game Portal</h1><p>Party games to play in the same room.</p></header>

</nav>

</div></section>

function route(){const g=location.hash.slice(1);let f=document.getElementById('game');
  if(GAMES[g]){if(!f||f.dataset.g!==g){if(f)f.remove();f=document.createElement('iframe');f.id='game';f.dataset.g=g;f.setAttribute('aria-label',g==='wavelength'?'Wavelength':'Imposter');
      f.setAttribute('allow','screen-wake-lock; clipboard-write; autoplay');f.srcdoc=decode(GAMES[g]);document.body.appendChild(f)}
    document.body.classList.add('playing');document.title=g==='wavelength'?'Wavelength':'Imposter'}
  else{if(f)f.remove();document.body.classList.remove('playing');document.title=g==='achievements'?'Achievements':'Game Portal'}
  document.body.classList.toggle('ach-open',g==='achievements')}

<script>
// Achievement log. The games post each unlock here; it goes into a queue saved on this device and is then sent to the
// achievements server (backend/ in this repo), so closing the page before it is sent loses nothing.
const ACH_API=''; // the deployed Worker, e.g. 'https://game-portal-achievements.<your-account>.workers.dev'
const ACHS={
  wavelength:{name:'Wavelength',list:[
    ['record','Co-op high score','Finish a game with the highest total score ever recorded.'],
    ['sync','Perfect Sync','Hit the 4-point bullseye on three clues in a row.'],
    ['comeback','Clutch Comeback','Hit the 4-point bullseye right after a clue that scored 0.'],
    ['tug','Tug of War','On the same clue, two guessers drag the arrow in opposite directions, yet it lands in the 3-point zone.']]},
  imposter:{name:'Imposter',list:[
    ['framed','Framed','The group votes out an innocent player first, and the imposters go on to win.'],
    ['actor','Born Actor','Win as an imposter in a game of 5 or more players without any imposter ever being voted out.'],
    ['sharp','Sharp Eye','The very first vote of the game catches an imposter.']]}
};
const achLs={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let outbox=achLs.get('ach_outbox',[]),server=achLs.get('ach_cache',{items:[],best:{}});
const achEsc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const list=a=>a.map(achEsc).join(', ');
function line(a){const t=Object.fromEntries(ACHS[a.game].list.map(x=>[x[0],x[1]]))[a.type];
  switch(a.type){
    case 'record':return [`Set the co-op high score: <b>${a.score} points</b>`,`By ${list(a.lead)}`];
    case 'sync':return [`Unlocked <b>${t}</b>: three bullseyes in a row`,`By ${list(a.lead)}`];
    case 'comeback':return [`Unlocked <b>${t}</b>: a bullseye right after a miss`,`By ${list(a.lead)}`];
    case 'tug':return [`Unlocked <b>${t}</b>: pulled opposite ways, still landed on 3 points`,`By ${list(a.lead)}`];
    case 'framed':return [`Unlocked <b>${t}</b>: got the group to vote out an innocent player`,`Mastermind: ${list(a.lead)} · Victim: ${list(a.victims)}`+(a.others.length?` · Also playing: ${list(a.others)}`:'')];
    case 'actor':return [`Unlocked <b>${t}</b>: won as the imposter without being voted out`,`By ${list(a.lead)}`+(a.others.length?` · Also playing: ${list(a.others)}`:'')];
    case 'sharp':return [`Unlocked <b>${t}</b>: caught the imposter with the first vote`,`By ${list(a.lead)} · Imposter caught: ${list(a.victims)}`+(a.others.length?` · Also playing: ${list(a.others)}`:'')];
  }}
function day(at){const d=new Date(at),o={month:'short',day:'numeric'};if(d.getFullYear()!==new Date().getFullYear())o.year='numeric';return d.toLocaleDateString('en-US',o)}
function renderAch(){
  const have=new Set(server.items.map(a=>a.id));
  const all=[...server.items,...outbox.filter(a=>!have.has(a.id)).map(a=>({...a,pend:true}))].sort((a,b)=>b.at-a.at);
  for(const [g,info] of Object.entries(ACHS)){
    const mine=all.filter(a=>a.game===g&&info.list.some(x=>x[0]===a.type));
    document.getElementById('ach-'+g).innerHTML=`<h3>${info.name} achievement log</h3>`+
      (mine.length?`<ul>${mine.map(a=>{const [what,who]=line(a);
        return `<li><time datetime="${new Date(a.at).toISOString()}">${day(a.at)}</time>${what}${a.pend?' <span class="pend">(saved on this device, not synced yet)</span>':''}<span class="who">${who}</span></li>`}).join('')}</ul>`
        :`<p class="none">Nobody has unlocked one yet. Be the first!</p>`)+
      `<details><summary>How to unlock</summary><dl>${info.list.map(([,t,d])=>`<dt>${t}</dt><dd>${d}</dd>`).join('')}</dl></details>`}}
function bestScore(){return Math.max(server.best.wavelength||0,...server.items.concat(outbox).filter(a=>a.type==='record').map(a=>a.score))}
let flushing=false;
async function flush(){if(!ACH_API||flushing)return;flushing=true;
  try{
    for(const a of [...outbox]){let r;try{r=await fetch(ACH_API+'/achievements',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(a),keepalive:true})}catch(e){break}
      if(r.ok||(r.status>=400&&r.status<500)){outbox=outbox.filter(x=>x.id!==a.id);achLs.set('ach_outbox',outbox)}else break}
    const r=await fetch(ACH_API+'/achievements');if(r.ok){server=await r.json();achLs.set('ach_cache',server)}
  }catch(e){}finally{flushing=false;renderAch()}}
addEventListener('message',e=>{const f=document.getElementById('game'),a=e.data&&e.data.achievement;
  if(!f||e.source!==f.contentWindow||!a||typeof a!=='object'||!ACHS[a.game]||typeof a.id!=='string')return;
  if(outbox.some(x=>x.id===a.id)||server.items.some(x=>x.id===a.id))return;
  if(a.type==='record'&&!(a.score>bestScore()))return;
  outbox.push({id:a.id,game:a.game,type:a.type,score:a.score??null,lead:a.lead||[],others:a.others||[],victims:a.victims||[],at:Date.now()});
  achLs.set('ach_outbox',outbox);renderAch();flush()});
addEventListener('online',flush);
addEventListener('hashchange',()=>{if(location.hash==='#achievements')flush()});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')flush()});
renderAch();flush();
</script>
