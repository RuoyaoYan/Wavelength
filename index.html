<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Game Portal</title>
<style>
/* Layout: centered title with a block-built logo, a scrolling notice strip, then a single column of white pill buttons, one per game. */
*,*::before,*::after{box-sizing:border-box}
:root{
  --bg:#ededed; --pill:#ffffff; --ink:#1f1f1f; --muted:#6b6b6b; --link:#2f6fe0;
  --font:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans','Noto Sans',Roboto,sans-serif;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
html,body{background:var(--bg);color:var(--ink);min-height:100%}
body{margin:0;font-family:var(--font);font-size:17px;line-height:1.4;padding-block:28px 48px}
.top{display:flex;align-items:center;justify-content:center;gap:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top svg{width:64px;height:64px;flex-shrink:0}
h1{margin:0;font-size:2.6rem;font-weight:800;letter-spacing:.02em;line-height:1}
.news{margin-top:26px;background:#fff;overflow:hidden;white-space:nowrap;border-block:1px solid #e2e2e2}
.news div{display:inline-block;padding:12px 0;padding-left:100%;color:var(--link);font-size:1rem;animation:scroll 22s linear infinite}
@keyframes scroll{to{transform:translateX(-100%)}}
.list{display:flex;flex-direction:column;align-items:center;gap:26px;margin-top:40px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.pill{display:grid;grid-template-columns:48px 1fr 48px;align-items:center;width:min(260px,100%);min-height:66px;padding:8px 14px;
  background:var(--pill);border-radius:999px;color:var(--ink);text-decoration:none;font-size:1.4rem;font-weight:500;
  box-shadow:0 6px 10px -4px rgba(0,0,0,.18),0 1px 2px rgba(0,0,0,.06);transition:transform .12s ease,box-shadow .12s ease}
.pill span{text-align:center;min-width:0;overflow-wrap:anywhere}
.pill svg{width:44px;height:44px}
.pill:hover{transform:translateY(-2px);box-shadow:0 10px 14px -6px rgba(0,0,0,.22),0 1px 2px rgba(0,0,0,.06)}
.pill:active{transform:translateY(1px)}
.pill:focus-visible{outline:3px solid var(--link);outline-offset:3px}
.foot{margin:40px auto 0;max-width:30ch;text-align:center;color:var(--muted);font-size:.9rem;padding-inline:16px}
#game{position:fixed;inset:0;width:100%;height:100%;border:0;z-index:50;background:#050b16}
#game[data-g="imposter"]{background:#ecedf2}
body.playing{overflow:hidden}
@media (max-width:380px){h1{font-size:2.1rem}.top svg{width:52px;height:52px}}
@media (prefers-reduced-motion:reduce){.news div{animation:none;padding-left:16px;white-space:normal}.pill{transition:none}}
</style>
</head><body>
<header class="top"><span data-icon="#d9822b"></span><h1>Game Portal</h1></header>
<nav class="list" aria-label="Games">
  <a class="pill" href="#wavelength"><span data-icon="#4fa3d9"></span><span>Wavelength</span></a>
  <a class="pill" href="#imposter"><span data-icon="#d24b4b"></span><span>Imposter</span></a>
</nav>
<p class="foot">Tap a game to start.</p>
<script>
// Block-built hexagon ring logo, drawn as little isometric cubes.
function shade(hex,f){const n=parseInt(hex.slice(1),16);let r=n>>16,g=n>>8&255,b=n&255;
  const m=v=>Math.max(0,Math.min(255,Math.round(f>1?v+(255-v)*(f-1):v*f)));return `rgb(${m(r)},${m(g)},${m(b)})`}
function ringIcon(c){
  const R=30,s=7,pts=[];
  for(let k=0;k<6;k++){const a=Math.PI/180*(60*k-90),b=Math.PI/180*(60*(k+1)-90);
    const A=[R*Math.cos(a),R*Math.sin(a)],B=[R*Math.cos(b),R*Math.sin(b)];
    for(let t=0;t<3;t++){const u=t/3;pts.push([A[0]+(B[0]-A[0])*u,A[1]+(B[1]-A[1])*u])}}
  pts.sort((p,q)=>p[1]-q[1]);
  const top=shade(c,1.25),left=c,right=shade(c,.72),edge=shade(c,.55);
  let g='';
  for(const [x0,y0] of pts){const x=50+x0,y=50+y0,h=s*.58;
    g+=`<path d="M${x} ${y-2*h}L${x+s} ${y-h}L${x} ${y}L${x-s} ${y-h}Z" fill="${top}" stroke="${edge}" stroke-width=".6"/>`
     +`<path d="M${x-s} ${y-h}L${x} ${y}L${x} ${y+s}L${x-s} ${y+s-h}Z" fill="${left}" stroke="${edge}" stroke-width=".6"/>`
     +`<path d="M${x+s} ${y-h}L${x} ${y}L${x} ${y+s}L${x+s} ${y+s-h}Z" fill="${right}" stroke="${edge}" stroke-width=".6"/>`}
  return `<svg viewBox="8 8 84 92" aria-hidden="true">${g}</svg>`;
}
document.querySelectorAll('[data-icon]').forEach(el=>el.outerHTML=ringIcon(el.dataset.icon));
</script>
