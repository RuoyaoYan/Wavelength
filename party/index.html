<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#eef1f7">
<title>Party</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800;900&display=swap">
<style>
/* Layout: one phone-width column of chunky white cards on a dotted ground (two columns on a big screen).
   In a game the stage fills the screen; on phones a Joy-Con style pad (blue stick half, red button half) docks at the bottom. */
*,*::before,*::after{box-sizing:border-box}
:root{
  --bg:#eef1f7; --dot:#dde2ee; --card:#fff; --line:#e1e5ef; --field:#f1f3f9;
  --ink:#1d1d2c; --muted:#6a6f85;
  --red:#ff3b4e; --red-dk:#c41a2e; --blue:#2f8cff; --blue-dk:#1b5fc4; --yellow:#ffc21a; --yellow-dk:#c48c00;
  --green:#22b573; --green-dk:#16804f; --jc-blue:#00b8e0; --jc-red:#ff4554;
  --font:'Outfit','Avenir Next',system-ui,-apple-system,sans-serif;
  color-scheme:light;
}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink)}
body{font-family:var(--font);font-size:17px;line-height:1.35;-webkit-tap-highlight-color:transparent;touch-action:manipulation;
  background-image:radial-gradient(var(--dot) 2px,transparent 2.5px);background-size:22px 22px}
button{font-family:inherit}
[hidden]{display:none!important}
.wrap{max-width:520px;margin:0 auto;padding:max(18px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(32px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));display:flex;flex-direction:column;gap:16px}
.center-col{min-height:100vh;min-height:100dvh;justify-content:center;align-items:stretch;text-align:center}
.back{color:var(--muted);text-decoration:none;font-weight:700;font-size:.95rem;align-self:flex-start}
.logo{margin:6px 0 0;font-size:4.2rem;font-weight:900;line-height:.95;letter-spacing:-.02em;text-align:center;display:flex;justify-content:center}
.logo span{display:inline-block;color:#fff;-webkit-text-stroke:0;text-shadow:0 5px 0 var(--ink);paint-order:stroke fill;
  transform:rotate(calc((var(--i) - 2.5) * 3deg)) translateY(calc(var(--i) * 0px));animation:bob 2.4s ease-in-out infinite;animation-delay:calc(var(--i) * -.18s)}
.logo span:nth-child(6n+1){color:var(--red)}.logo span:nth-child(6n+2){color:var(--blue)}.logo span:nth-child(6n+3){color:var(--yellow)}
.logo span:nth-child(6n+4){color:var(--green)}.logo span:nth-child(6n+5){color:#a45cff}.logo span:nth-child(6n){color:#ff8a1f}
.logo.small{font-size:2.2rem;margin:0}.logo.small span{text-shadow:0 3px 0 var(--ink)}
@keyframes bob{50%{translate:0 -4px}}
.tag{margin:-4px 0 0;text-align:center;color:var(--muted);font-weight:600}
.card{background:var(--card);border-radius:26px;padding:18px;display:flex;flex-direction:column;gap:12px;box-shadow:0 5px 0 var(--line),0 12px 24px -16px rgba(29,29,44,.35)}
.card.center{align-items:center;text-align:center}
.card h2{margin:0;font-size:1.6rem;font-weight:900;line-height:1.1}
.lbl{margin:0;text-transform:uppercase;letter-spacing:.14em;font-size:.78rem;font-weight:800;color:var(--muted)}
.head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.count{font-weight:800;color:var(--muted)}
.muted{color:var(--muted);margin:0}.small{font-size:.9rem}
.field{font:600 1.1rem var(--font);background:var(--field);color:var(--ink);border:2.5px solid var(--line);border-radius:16px;padding:14px 16px;width:100%;min-width:0}
.field:focus{outline:none;border-color:var(--ink)}
.code-field{text-transform:uppercase;letter-spacing:.3em;font-weight:900;font-size:1.4rem;text-align:center}
.row{display:flex;gap:10px;width:100%}.row>*{flex:1}
.err{margin:0;color:var(--red-dk);font-weight:700;min-height:1.2em;text-align:center}
.err:empty{display:none}
.btn{--c:var(--ink);--d:#000;font:800 1.12rem var(--font);border:0;border-radius:20px;padding:15px 18px;min-height:56px;color:#fff;background:var(--c);
  box-shadow:0 6px 0 var(--d);cursor:pointer;transition:transform .06s,box-shadow .06s;margin-bottom:6px}
.btn:active:not(:disabled){transform:translateY(4px);box-shadow:0 2px 0 var(--d)}
.btn:disabled{opacity:.4;cursor:default}
.btn.red{--c:var(--red);--d:var(--red-dk)}.btn.blue{--c:var(--blue);--d:var(--blue-dk)}
.btn.yellow{--c:var(--yellow);--d:var(--yellow-dk);color:var(--ink)}.btn.green{--c:var(--green);--d:var(--green-dk)}
.btn.ghost{--c:#fff;--d:var(--line);color:var(--ink)}
.btn.slim{min-height:44px;padding:8px 16px;font-size:.95rem;flex:0 0 auto}
.btn.tall{display:flex;flex-direction:column;align-items:center;gap:2px;padding:18px}
.btn.tall b{font-size:1.2rem}.btn.tall small{font-weight:600;opacity:.85;font-size:.9rem}
.host-btns{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.or{display:flex;align-items:center;gap:12px;color:var(--muted);font-weight:700;font-size:.9rem}
.or::before,.or::after{content:"";flex:1;height:2px;background:var(--line);border-radius:2px}
.note{margin:0;text-align:center;color:var(--muted);font-size:.92rem}
:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
.spinner{width:56px;height:56px;margin:12px auto;border-radius:50%;border:7px solid var(--line);border-top-color:var(--red);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(1turn)}}
.big-msg{font-size:1.3rem;font-weight:800;margin:0}
/* lobby */
.bar{display:flex;justify-content:space-between;align-items:center;gap:10px}
.lobby-grid{display:grid;gap:16px}.col{display:flex;flex-direction:column;gap:16px;min-width:0}
.joinbox{align-items:center;text-align:center}
.bigcode{display:flex;gap:8px}
.bigcode span{width:62px;height:76px;display:grid;place-items:center;background:var(--ink);color:#fff;border-radius:16px;font-size:2.6rem;font-weight:900;box-shadow:0 5px 0 #000}
.url{margin:0;color:var(--muted);font-weight:600;font-size:.9rem;overflow-wrap:anywhere}
.qr{width:150px;max-width:60%}.qr svg{width:100%;height:auto;display:block}
.roompill{align-self:center;background:var(--ink);color:#fff;border-radius:999px;padding:8px 18px;font-weight:700}
.roompill b{letter-spacing:.15em}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.pchip{display:inline-flex;align-items:center;gap:8px;padding:8px 14px 8px 8px;border-radius:999px;background:var(--field);font-weight:800;max-width:100%;overflow-wrap:anywhere}
.pchip i{width:22px;height:22px;border-radius:50%;background:var(--c);box-shadow:inset 0 -3px 0 rgba(0,0,0,.2);flex-shrink:0}
.pchip.me{outline:2.5px solid var(--ink)}
.pchip.off{opacity:.45}
.pchip em{font-style:normal;font-size:.72rem;font-weight:800;text-transform:uppercase;letter-spacing:.06em;background:var(--ink);color:#fff;border-radius:999px;padding:2px 7px}
.games{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.gcard{position:relative;text-align:left;border:0;border-radius:20px;padding:14px 14px 16px;background:var(--c);color:#fff;cursor:pointer;display:flex;flex-direction:column;gap:4px;min-height:104px;
  box-shadow:0 5px 0 rgba(0,0,0,.28) , inset 0 0 0 999px rgba(0,0,0,0);transition:transform .06s}
.gcard:active:not(:disabled){transform:translateY(3px)}
.gcard b{font-size:1.2rem;font-weight:900;line-height:1.05;text-shadow:0 2px 0 rgba(0,0,0,.2)}
.gcard small{font-weight:600;font-size:.85rem;line-height:1.25;opacity:.95}
.gcard em{font-style:normal;font-weight:800;font-size:.75rem;background:rgba(0,0,0,.35);border-radius:999px;padding:2px 8px;align-self:flex-start}
.gcard:disabled{filter:grayscale(.7);opacity:.55;cursor:default}
.games .gcard:last-child:nth-child(odd){grid-column:span 2}
.board{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.board li{display:grid;grid-template-columns:2em 22px 1fr auto;align-items:center;gap:10px;padding:8px 12px;border-radius:14px;background:var(--field);font-weight:700;text-align:left}
.board li.me{outline:2.5px solid var(--ink)}
.board li i{width:22px;height:22px;border-radius:50%;background:var(--c)}
.board li span{min-width:0;overflow-wrap:anywhere}
.board .rk{font-weight:900;color:var(--muted)}
.board .plus{color:var(--green-dk)}
.waitcard{padding:26px 18px}
.dots{display:flex;gap:8px}.dots i{width:14px;height:14px;border-radius:50%;background:var(--red);animation:bob 1s ease-in-out infinite}
.dots i:nth-child(2){background:var(--blue);animation-delay:.15s}.dots i:nth-child(3){background:var(--yellow);animation-delay:.3s}
/* results + podium */
.winner{margin:0;font-size:2.2rem;font-weight:900;line-height:1.1;text-wrap:balance}
.crown{display:block;font-size:3rem;margin-bottom:4px}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:10px;margin-top:8px}
.step{display:flex;flex-direction:column;align-items:center;gap:4px;width:30%;min-width:0}
.pname{font-weight:900;font-size:1.1rem;overflow-wrap:anywhere}.ppts{color:var(--muted);font-weight:700;font-size:.9rem}
.block{width:100%;border-radius:16px 16px 6px 6px;background:var(--c);color:#fff;font-size:2.2rem;font-weight:900;display:grid;place-items:center;box-shadow:inset 0 -6px 0 rgba(0,0,0,.2)}
.s1 .block{height:150px}.s2 .block{height:110px}.s3 .block{height:80px}
/* game */
body:has([data-screen="game"]){overflow:hidden;background:#1d1d2c}
#app[data-screen="game"]{position:fixed;inset:0}
.game{position:absolute;inset:0;display:flex;flex-direction:column;background:#1d1d2c;touch-action:none;user-select:none;-webkit-user-select:none}
.game-top{display:flex;align-items:baseline;gap:10px;padding:max(8px,env(safe-area-inset-top)) 14px 8px;color:#fff;background:var(--c);box-shadow:0 3px 0 rgba(0,0,0,.25);z-index:1}
.game-top b{font-weight:900;font-size:1.1rem;white-space:nowrap}
.game-top span{font-size:.85rem;font-weight:600;opacity:.9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.stage{position:relative;flex:1;min-height:0;overflow:hidden}
.game-canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.padwrap{flex:0 0 auto;height:34vh;height:34dvh;min-height:170px;max-height:300px;padding-bottom:env(safe-area-inset-bottom)}
.pad{height:100%;display:grid;grid-template-columns:1fr 1fr}
.pad.no-stick{grid-template-columns:1fr}
.stick-zone{position:relative;background:var(--jc-blue);border-radius:22px 0 0 0;overflow:hidden;touch-action:none}
.btn-zone{position:relative;background:var(--jc-red);border-radius:0 22px 0 0;display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap;padding:12px;touch-action:none}
.stick-base{position:absolute;left:50%;top:50%;width:112px;height:112px;margin:-56px 0 0 -56px;border-radius:50%;background:rgba(0,0,0,.18);box-shadow:inset 0 4px 10px rgba(0,0,0,.25);pointer-events:none}
.stick-knob{position:absolute;left:28px;top:28px;width:56px;height:56px;border-radius:50%;background:#2a2c3d;box-shadow:0 5px 0 #000,inset 0 -6px 0 rgba(255,255,255,.08)}
.pad-hint{position:absolute;left:0;right:0;bottom:10px;text-align:center;color:rgba(0,0,0,.45);font-weight:800;font-size:.8rem;pointer-events:none}
.stick-zone.active .pad-hint{opacity:0}
.pad-btn{width:96px;height:96px;border-radius:50%;border:0;background:#2a2c3d;color:#fff;font:900 1.05rem var(--font);box-shadow:0 7px 0 #000;cursor:pointer;touch-action:none}
.pad-btn.b1{width:76px;height:76px;font-size:.9rem}
.pad-btn.down{transform:translateY(5px);box-shadow:0 2px 0 #000}
/* game overlays drawn in DOM by some games */
.g-overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px;text-align:center;color:#fff}
@media (min-width:900px){
  .wrap.lobby{max-width:1100px}
  .lobby-grid{grid-template-columns:minmax(320px,1fr) 1.4fr;align-items:start}
  [data-role="screen"] .bigcode span{width:96px;height:116px;font-size:4rem;border-radius:22px}
  [data-role="screen"] .qr{width:220px}
  .games{grid-template-columns:repeat(3,1fr)}
  .games .gcard:last-child:nth-child(odd){grid-column:auto}
}
@media (max-width:370px){.logo{font-size:3.4rem}.bigcode span{width:52px;height:64px;font-size:2.1rem}.host-btns{grid-template-columns:1fr}.pad-btn{width:84px;height:84px}}
@media (prefers-reduced-motion:reduce){.logo span,.dots i{animation:none}.spinner{animation-duration:2s}}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
</head><body>
<main id="app" aria-live="polite"></main>
<noscript>Party needs JavaScript.</noscript>
<script type="module" src="js/app.js"></script>
</body></html>
